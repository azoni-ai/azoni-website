<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f5" />
    <!-- Per-route <meta name="description"> is emitted by src/components/Seo.jsx
         (React 19 head hoisting). No static description here — two would conflict,
         and the static one would win by tree order on every route. Social crawlers
         read og:description / twitter:description below, which are static. -->

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=JetBrains+Mono:wght@400;500&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Open Graph -->
    <meta property="og:site_name" content="Charlton Smith" />
    <meta property="og:title" content="Charlton Smith &mdash; Principal Software Engineer &amp; AI Consultant" />
    <meta property="og:description" content="Principal engineering, applied AI, and full-stack product development. Independent consulting with Charlton Smith." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://azoni.ai" />
    <meta property="og:image" content="https://azoni.ai/images/consulting-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Charlton Smith - Software and AI consulting. Principal engineering. Applied AI. Product development." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Charlton Smith &mdash; Principal Software Engineer &amp; AI Consultant" />
    <meta name="twitter:description" content="Principal engineering, applied AI, and full-stack product development. Independent consulting with Charlton Smith." />
    <meta name="twitter:image" content="https://azoni.ai/images/consulting-og.png" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/consulting-icon-192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Charlton Smith &mdash; Principal Software Engineer &amp; AI Consultant</title>
  </head>
  <body>
    <noscript><p>Charlton Smith &mdash; Principal Software Engineer &amp; AI Consultant. Software engineering, applied AI, and product development. Email <a href="mailto:charltonuw@gmail.com">charltonuw@gmail.com</a> about a project. Enable JavaScript to explore services and selected work.</p></noscript>
    <div id="root"></div>
  </body>
</html>
