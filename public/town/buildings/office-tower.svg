<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" shape-rendering="crispEdges">
  <!-- Ground -->
  <rect x="0" y="144" width="160" height="16" fill="#8b7355"/>
  <!-- Main tall building -->
  <rect x="32" y="16" width="96" height="128" fill="#e20074"/>
  <rect x="32" y="16" width="96" height="8" fill="#f472b6"/>
  <!-- Shadow -->
  <rect x="120" y="16" width="8" height="128" fill="#be185d"/>
  <!-- Roof detail -->
  <rect x="32" y="12" width="96" height="4" fill="#9d174d"/>
  <!-- "T" sign on top -->
  <rect x="56" y="0" width="48" height="12" fill="#9d174d"/>
  <rect x="64" y="2" width="32" height="2" fill="#f9a8d4"/>
  <rect x="76" y="2" width="8" height="8" fill="#f9a8d4"/>
  <!-- Floor 1 windows -->
  <rect x="40" y="28" width="16" height="12" fill="#fde68a"/>
  <rect x="64" y="28" width="16" height="12" fill="#fde68a"/>
  <rect x="88" y="28" width="16" height="12" fill="#fde68a"/>
  <!-- Floor 2 windows -->
  <rect x="40" y="48" width="16" height="12" fill="#fde68a"/>
  <rect x="64" y="48" width="16" height="12" fill="#fde68a"/>
  <rect x="88" y="48" width="16" height="12" fill="#fde68a"/>
  <!-- Floor 3 windows -->
  <rect x="40" y="68" width="16" height="12" fill="#fde68a"/>
  <rect x="64" y="68" width="16" height="12" fill="#fde68a"/>
  <rect x="88" y="68" width="16" height="12" fill="#fde68a"/>
  <!-- Floor 4 windows -->
  <rect x="40" y="88" width="16" height="12" fill="#bfdbfe"/>
  <rect x="64" y="88" width="16" height="12" fill="#bfdbfe"/>
  <rect x="88" y="88" width="16" height="12" fill="#bfdbfe"/>
  <!-- Floor dividers -->
  <rect x="32" y="44" width="96" height="2" fill="#9d174d"/>
  <rect x="32" y="64" width="96" height="2" fill="#9d174d"/>
  <rect x="32" y="84" width="96" height="2" fill="#9d174d"/>
  <rect x="32" y="104" width="96" height="2" fill="#9d174d"/>
  <!-- Entrance -->
  <rect x="56" y="112" width="48" height="32" fill="#9d174d"/>
  <rect x="60" y="112" width="40" height="4" fill="#f472b6"/>
  <!-- Glass doors -->
  <rect x="60" y="116" width="18" height="28" fill="#831843"/>
  <rect x="82" y="116" width="18" height="28" fill="#831843"/>
  <!-- Lobby glow -->
  <rect x="64" y="120" width="10" height="20" fill="#fde68a" opacity="0.3"/>
</svg>
