<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" shape-rendering="crispEdges">
  <!-- Ground -->
  <rect x="0" y="144" width="160" height="16" fill="#8b7355"/>
  <!-- Main building (white) -->
  <rect x="20" y="48" width="120" height="96" fill="#f8fafc"/>
  <rect x="20" y="48" width="120" height="8" fill="#ffffff"/>
  <!-- Shadow -->
  <rect x="132" y="48" width="8" height="96" fill="#e2e8f0"/>
  <!-- Roof -->
  <rect x="12" y="36" width="136" height="12" fill="#cbd5e1"/>
  <rect x="20" y="28" width="120" height="8" fill="#94a3b8"/>
  <!-- Red cross sign -->
  <rect x="56" y="4" width="48" height="24" fill="#ffffff"/>
  <rect x="56" y="4" width="48" height="2" fill="#e2e8f0"/>
  <!-- Cross -->
  <rect x="72" y="8" width="16" height="16" fill="#f87171"/>
  <rect x="68" y="12" width="24" height="8" fill="#f87171"/>
  <!-- Windows -->
  <rect x="28" y="60" width="24" height="20" fill="#bfdbfe"/>
  <rect x="68" y="60" width="24" height="20" fill="#bfdbfe"/>
  <rect x="108" y="60" width="24" height="20" fill="#bfdbfe"/>
  <!-- Window crosses -->
  <rect x="39" y="60" width="2" height="20" fill="#e2e8f0"/>
  <rect x="28" y="69" width="24" height="2" fill="#e2e8f0"/>
  <rect x="79" y="60" width="2" height="20" fill="#e2e8f0"/>
  <rect x="68" y="69" width="24" height="2" fill="#e2e8f0"/>
  <rect x="119" y="60" width="2" height="20" fill="#e2e8f0"/>
  <rect x="108" y="69" width="24" height="2" fill="#e2e8f0"/>
  <!-- Red stripe -->
  <rect x="20" y="88" width="120" height="4" fill="#f87171"/>
  <!-- Door -->
  <rect x="60" y="104" width="40" height="40" fill="#94a3b8"/>
  <rect x="78" y="104" width="4" height="40" fill="#64748b"/>
  <!-- Door cross -->
  <rect x="68" y="112" width="8" height="16" fill="#f87171"/>
  <rect x="64" y="116" width="16" height="8" fill="#f87171"/>
  <!-- Clean steps -->
  <rect x="52" y="140" width="56" height="4" fill="#e2e8f0"/>
