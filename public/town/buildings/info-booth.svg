<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" shape-rendering="crispEdges">
  <!-- Ground -->
  <rect x="0" y="144" width="160" height="16" fill="#8b7355"/>
  <!-- Booth base -->
  <rect x="32" y="72" width="96" height="72" fill="#60a5fa"/>
  <rect x="32" y="72" width="96" height="8" fill="#93c5fd"/>
  <!-- Shadow -->
  <rect x="120" y="72" width="8" height="72" fill="#3b82f6"/>
  <!-- Roof -->
  <rect x="24" y="56" width="112" height="16" fill="#2563eb"/>
  <rect x="32" y="48" width="96" height="8" fill="#1d4ed8"/>
  <!-- Chat bubble sign on top -->
  <rect x="52" y="16" width="56" height="28" fill="#ffffff"/>
  <rect x="48" y="20" width="8" height="20" fill="#ffffff"/>
  <rect x="104" y="20" width="8" height="20" fill="#ffffff"/>
  <rect x="68" y="44" width="8" height="8" fill="#ffffff"/>
  <rect x="60" y="44" width="8" height="4" fill="#ffffff"/>
  <!-- Dots in chat bubble -->
  <rect x="60" y="28" width="8" height="8" fill="#60a5fa"/>
  <rect x="72" y="28" width="8" height="8" fill="#60a5fa"/>
  <rect x="84" y="28" width="8" height="8" fill="#60a5fa"/>
  <!-- Glass front window -->
  <rect x="40" y="80" width="80" height="32" fill="#bfdbfe"/>
  <rect x="40" y="80" width="80" height="4" fill="#dbeafe"/>
  <!-- Glass reflection -->
  <rect x="44" y="84" width="16" height="16" fill="#dbeafe" opacity="0.5"/>
  <!-- Window shelf -->
  <rect x="40" y="112" width="80" height="4" fill="#1e40af"/>
  <!-- Open window slot -->
  <rect x="48" y="116" width="64" height="16" fill="#1e3a5f"/>
  <!-- Counter -->
  <rect x="40" y="132" width="80" height="4" fill="#93c5fd"/>
  <!-- Side pillars -->
  <rect x="32" y="72" width="8" height="72" fill="#3b82f6"/>
  <rect x="120" y="72" width="8" height="72" fill="#2563eb"/>
</svg>
