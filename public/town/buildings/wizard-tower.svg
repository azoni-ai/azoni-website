<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" shape-rendering="crispEdges">
  <!-- Ground -->
  <rect x="0" y="144" width="160" height="16" fill="#8b7355"/>
  <!-- Tower base (wider) -->
  <rect x="32" y="96" width="96" height="48" fill="#c084fc"/>
  <rect x="32" y="96" width="96" height="8" fill="#d8b4fe"/>
  <rect x="120" y="96" width="8" height="48" fill="#a855f7"/>
  <!-- Tower middle -->
  <rect x="40" y="48" width="80" height="48" fill="#c084fc"/>
  <rect x="40" y="48" width="80" height="8" fill="#d8b4fe"/>
  <rect x="112" y="48" width="8" height="48" fill="#a855f7"/>
  <!-- Tower top -->
  <rect x="48" y="24" width="64" height="24" fill="#c084fc"/>
  <rect x="48" y="24" width="64" height="4" fill="#d8b4fe"/>
  <!-- Pointed roof -->
  <rect x="48" y="16" width="64" height="8" fill="#7e22ce"/>
  <rect x="56" y="8" width="48" height="8" fill="#7e22ce"/>
  <rect x="64" y="0" width="32" height="8" fill="#6b21a8"/>
  <rect x="72" y="0" width="16" height="4" fill="#581c87"/>
  <!-- Glowing window at top -->
  <rect x="64" y="28" width="32" height="16" fill="#fde68a"/>
  <rect x="68" y="32" width="8" height="8" fill="#fbbf24"/>
  <rect x="84" y="32" width="8" height="8" fill="#fbbf24"/>
  <!-- Stars around tower -->
  <rect x="16" y="16" width="8" height="8" fill="#fde68a" opacity="0.8"/>
  <rect x="136" y="8" width="8" height="8" fill="#fde68a" opacity="0.6"/>
  <rect x="8" y="40" width="8" height="8" fill="#fde68a" opacity="0.5"/>
  <rect x="144" y="32" width="8" height="8" fill="#fde68a" opacity="0.7"/>
  <rect x="24" y="64" width="4" height="4" fill="#fde68a" opacity="0.4"/>
  <rect x="140" y="60" width="4" height="4" fill="#fde68a" opacity="0.4"/>
  <!-- Middle windows -->
  <rect x="52" y="60" width="16" height="16" fill="#fde68a"/>
  <rect x="92" y="60" width="16" height="16" fill="#fde68a"/>
  <!-- Door -->
  <rect x="60" y="112" width="40" height="32" fill="#581c87"/>
  <rect x="64" y="108" width="32" height="4" fill="#581c87"/>
  <rect x="68" y="104" width="24" height="4" fill="#581c87"/>
  <!-- Door glow -->
  <rect x="72" y="116" width="16" height="24" fill="#7e22ce"/>
</svg>
