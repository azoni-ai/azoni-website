<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" shape-rendering="crispEdges">
  <!-- Base/ground -->
  <rect x="0" y="144" width="160" height="16" fill="#8b7355"/>
  <!-- Main building body -->
  <rect x="24" y="64" width="112" height="80" fill="#a78bfa"/>
  <rect x="24" y="64" width="112" height="8" fill="#c4b5fd"/>
  <!-- Shadow on right side -->
  <rect x="128" y="64" width="8" height="80" fill="#8b5cf6"/>
  <!-- Clock tower -->
  <rect x="56" y="16" width="48" height="48" fill="#a78bfa"/>
  <rect x="56" y="16" width="48" height="8" fill="#c4b5fd"/>
  <rect x="136" y="16" width="8" height="48" fill="#8b5cf6"/>
  <!-- Tower roof -->
  <rect x="64" y="8" width="32" height="8" fill="#7c3aed"/>
  <rect x="72" y="0" width="16" height="8" fill="#7c3aed"/>
  <!-- Flag pole and flag -->
  <rect x="78" y="0" width="2" height="8" fill="#6b7280"/>
  <rect x="80" y="0" width="16" height="8" fill="#ef4444"/>
  <!-- Clock face -->
  <rect x="68" y="28" width="24" height="24" fill="#fde68a"/>
  <rect x="76" y="32" width="8" height="8" fill="#92400e"/>
  <rect x="80" y="36" width="8" height="4" fill="#92400e"/>
  <!-- Windows row 1 -->
  <rect x="36" y="76" width="16" height="16" fill="#fde68a"/>
  <rect x="72" y="76" width="16" height="16" fill="#fde68a"/>
  <rect x="108" y="76" width="16" height="16" fill="#fde68a"/>
  <!-- Window panes -->
  <rect x="43" y="76" width="2" height="16" fill="#92400e"/>
  <rect x="79" y="76" width="2" height="16" fill="#92400e"/>
  <rect x="115" y="76" width="2" height="16" fill="#92400e"/>
  <!-- Arched entrance -->
  <rect x="60" y="112" width="40" height="32" fill="#4c1d95"/>
  <rect x="64" y="108" width="32" height="4" fill="#4c1d95"/>
  <rect x="68" y="104" width="24" height="4" fill="#4c1d95"/>
  <!-- Door detail -->
  <rect x="78" y="112" width="4" height="32" fill="#5b21b6"/>
  <!-- Steps -->
  <rect x="52" y="144" width="56" height="8" fill="#d6d3d1"/>
  <rect x="56" y="140" width="48" height="4" fill="#e7e5e4"/>
</svg>
