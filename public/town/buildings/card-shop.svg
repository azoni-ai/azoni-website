  <rect x="96" y="72" width="12" height="16" fill="#8b5cf6"/>
  <rect x="112" y="72" width="12" height="16" fill="#22c55e"/>
  <!-- Door -->
  <rect x="64" y="108" width="32" height="36" fill="#78350f"/>
  <rect x="78" y="108" width="4" height="36" fill="#92400e"/>
