<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="hat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b35"/>
      <stop offset="100%" style="stop-color:#ff4500"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd93d"/>
      <stop offset="100%" style="stop-color:#ff6b35"/>
    </linearGradient>
    <filter id="spark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#ffd93d" stroke-width="2"/>
  
  <!-- Wizard robe body -->
  <path d="M32 28 L22 52 L42 52 Z" fill="url(#hat)"/>
  
  <!-- Wizard head -->
  <circle cx="32" cy="24" r="8" fill="#fcd5ce"/>
  
  <!-- Wizard hat -->
  <path d="M32 4 L20 26 L44 26 Z" fill="url(#hat)"/>
  <ellipse cx="32" cy="26" rx="13" ry="3" fill="#cc5500"/>
  
  <!-- Eyes -->
  <circle cx="29" cy="23" r="1.5" fill="#333"/>
  <circle cx="35" cy="23" r="1.5" fill="#333"/>
  
  <!-- Magic sparkles -->
  <g filter="url(#spark)">
    <!-- Star 1 -->
    <path d="M50 18 L51 21 L54 22 L51 23 L50 26 L49 23 L46 22 L49 21 Z" fill="#ffd93d"/>
    <!-- Star 2 -->
    <path d="M14 38 L15 40 L17 41 L15 42 L14 44 L13 42 L11 41 L13 40 Z" fill="#4ecdc4"/>
    <!-- Star 3 -->
    <path d="M48 42 L49 44 L51 45 L49 46 L48 48 L47 46 L45 45 L47 44 Z" fill="#9b5de5"/>
  </g>
  
  <!-- Magic orb in front -->
  <circle cx="32" cy="48" r="5" fill="#ffd93d" opacity="0.9"/>
  <circle cx="32" cy="48" r="3" fill="#fff" opacity="0.6"/>
</svg>
