[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."chat"]
  timeout = 26

[functions."chat-stream"]
  timeout = 26

[functions."chat-eval"]
  timeout = 26

[functions."leaderboard"]
  timeout = 26

[functions."daily-blog"]
  schedule = "0 17 * * *"

[functions."azoni-orchestrator"]
  schedule = "0 */3 * * *"